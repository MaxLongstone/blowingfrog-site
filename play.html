<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>Frogpocalypse — Blowing Frog</title>
  <meta name="description" content="Cross the highway. Eat five explosives. Detonate. Come back bigger. A Frogger-style game by Blowing Frog.">
  <link rel="icon" type="image/png" href="assets/images/logo_blowingfrog.png">
  <link rel="apple-touch-icon" href="assets/images/logo_blowingfrog.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;500;700;800;900&family=Barlow:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Playfair+Display:ital,wght@1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css?v=5">
  <style>
    body.game-page { cursor: auto; overflow: hidden; height: 100vh; }
    #game-root, #game-root * {
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    body.game-page .cursor, body.game-page .cursor-dot { display: none; }

    #game-root {
      position: fixed; inset: var(--nav-h) 0 0 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg);
      overflow: hidden;
    }
    /* The cabinet art. Its painted screen is the black rectangle at 50% / 68%,
       so the playfield is offset down to sit on it rather than dead centre. */
    /* The art is 1376x768 and its painted screen is a known rectangle inside it,
       so the stage keeps that exact aspect and everything registers in percentages. */
    #game-portal {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: min(100%, calc((100vh - var(--nav-h)) * 1.7917));
      aspect-ratio: 1376 / 768; z-index: 0;
      background: url('assets/images/game-portal.jpg') center / contain no-repeat;
      transition: opacity .6s ease, filter .6s ease;
    }
    body.playing #game-portal { opacity: .22; filter: saturate(.45) blur(3px); }
    /* While a stage is being played the art drops back so the game reads. */
    #game-stack { position: relative; z-index: 1; }
    #game-stack { position: relative; }
    #game-mount {
      position: relative; border-radius: 16px; overflow: hidden;
      box-shadow: 0 30px 90px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.08);
      background: #0b0b0b;
    }
    #game-mount canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #overlay-root { position: absolute; inset: 0; pointer-events: none; }
    #overlay-root > * { pointer-events: auto; }

    #game-loading {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-family: var(--f-display); font-size: 13px; letter-spacing: .18em;
      text-transform: uppercase; color: var(--text-muted); z-index: 5;
    }

    /* ── HUD ── */
    .bf-hud {
      position: absolute; top: 0; left: 0; right: 0;
      display: flex; align-items: flex-start; justify-content: space-between;
      padding: 14px 18px; gap: 12px; z-index: 3;
      font-family: var(--f-display); color: #fff; pointer-events: none;
      transition: opacity .3s ease;
      text-shadow: 0 2px 10px rgba(0,0,0,0.8);
    }
    .bf-stage-name { font-size: 17px; font-weight: 900; letter-spacing: .04em; text-transform: uppercase; line-height: 1; }
    .bf-stage-sub  { font-size: 11px; letter-spacing: .1em; opacity: .6; margin-top: 4px; font-family: var(--f-body); }
    .bf-hud-mid { text-align: center; }
    .bf-fuse-label { font-size: 9px; letter-spacing: .22em; opacity: .55; margin-bottom: 5px; }
    .bf-fuse { display: flex; gap: 5px; justify-content: center; }
    .bf-pip {
      width: 16px; height: 7px; border-radius: 3px;
      background: rgba(255,255,255,0.16);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.14);
      transition: background .18s ease, box-shadow .18s ease;
    }
    .bf-pip.on { background: #f08a24; box-shadow: 0 0 12px rgba(240,138,36,0.85); }
    .bf-fuse.full .bf-pip.on { background: #e23c2f; box-shadow: 0 0 16px rgba(226,60,47,1); animation: bf-tick .42s infinite; }
    @keyframes bf-tick { 0%,100% { opacity: 1; } 50% { opacity: .45; } }
    .bf-power {
      margin-top: 7px; font-size: 10px; font-weight: 800; letter-spacing: .14em;
      opacity: 0; transition: opacity .2s ease; min-height: 13px;
      font-variant-numeric: tabular-nums;
    }
    .bf-power.on { opacity: 1; }
    .bf-power.invuln { color: #7fc7e8; text-shadow: 0 0 12px rgba(127,199,232,.9); }
    .bf-power.freeze { color: #9fd8ff; text-shadow: 0 0 12px rgba(159,216,255,.9); }
    .bf-power.fire   { color: #f08a24; text-shadow: 0 0 12px rgba(240,138,36,.9); }
    .bf-power.armor  { color: #c0c4cc; text-shadow: 0 0 12px rgba(192,196,204,.8); }

    .bf-hud-right { text-align: right; }
    .bf-lives { display: flex; gap: 3px; justify-content: flex-end; font-size: 15px; line-height: 1; }
    .bf-lives.hearts .bf-life { color: #e23c2f; font-size: 17px; }
    .bf-score { font-size: 20px; font-weight: 900; letter-spacing: .06em; margin-top: 5px; font-variant-numeric: tabular-nums; }

    .bf-toast {
      position: absolute; left: 50%; top: 30%; transform: translate(-50%, -6px);
      font-family: var(--f-display); font-size: 22px; font-weight: 900;
      letter-spacing: .08em; text-transform: uppercase; color: #fff;
      text-shadow: 0 3px 18px rgba(0,0,0,0.9); opacity: 0; z-index: 4;
      transition: opacity .2s ease, transform .3s ease; pointer-events: none; white-space: nowrap;
    }
    .bf-toast.show { opacity: 1; transform: translate(-50%, -14px); }

    /* ── Overlay cards ── */
    .bf-overlay {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: rgba(6,6,8,0.86); backdrop-filter: blur(8px); z-index: 10;
      opacity: 1; padding: 20px;
      animation: bf-overlay-in .28s ease both;
    }
    .bf-overlay.in { opacity: 1; }
    @keyframes bf-overlay-in { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .bf-overlay { animation: none; } }
    .bf-card {
      max-width: 460px; text-align: center; font-family: var(--f-body); color: #fff;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .bf-eyebrow { font-family: var(--f-display); font-size: 12px; letter-spacing: .24em; text-transform: uppercase; color: var(--accent-lt); }
    .bf-title {
      font-family: var(--f-display); font-weight: 900; text-transform: uppercase;
      font-size: clamp(38px, 9vw, 66px); line-height: .92; letter-spacing: -.02em; margin: 0;
    }
    .bf-title span { color: var(--accent-lt); display: block; }
    .bf-title.small { font-size: clamp(26px, 6vw, 40px); }
    .bf-body { font-size: 16px; line-height: 1.65; color: rgba(255,255,255,0.78); margin: 0; max-width: 42ch; }
    .bf-keys { font-size: 13px; letter-spacing: .04em; color: rgba(255,255,255,0.58); line-height: 2.1; }
    .bf-keys b { color: #fff; background: rgba(255,255,255,0.1); padding: 3px 7px; border-radius: 4px; font-weight: 700; }
    .bf-note { font-size: 12.5px; color: rgba(255,255,255,0.5); font-style: italic; margin: 0; max-width: 44ch; }
    .bf-size { font-family: var(--f-display); font-size: 14px; letter-spacing: .2em; color: var(--accent-lt); }
    .bf-scoreline { font-family: var(--f-display); font-size: 22px; font-weight: 900; letter-spacing: .08em; line-height: 1.5; }
    .bf-scoreline span { font-size: 13px; opacity: .55; letter-spacing: .14em; }
    .bf-best { font-family: var(--f-display); font-size: 13px; letter-spacing: .2em; opacity: .5; }
    .bf-btn {
      font-family: var(--f-display); font-size: 15px; font-weight: 800; letter-spacing: .16em;
      text-transform: uppercase; color: #0b0b0b; background: var(--accent-lt);
      border: 0; border-radius: 999px; padding: 14px 40px; cursor: pointer;
      transition: transform .18s var(--ease), background .18s ease; margin-top: 6px;
    }
    .bf-btn:hover { transform: translateY(-2px) scale(1.03); background: #c3ce35; }
    .bf-btn.ghost { background: transparent; color: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,0.25); padding: 12px 30px; font-size: 12px; }
    .bf-btn.ghost:hover { background: rgba(255,255,255,0.08); }

    /* Title screen: no scrim at all, the art is the page. The overlay is
       stretched over the portal stage so children can use its coordinates. */
    .bf-overlay.title {
      background: none; backdrop-filter: none; padding: 0;
      /* Fixed, and matched to the portal's box, so it registers on the artwork
         rather than on the playfield canvas it happens to live inside. */
      position: fixed; left: 50%;
      top: calc(var(--nav-h) + (100vh - var(--nav-h)) / 2);
      transform: translate(-50%, -50%);
      width: min(100vw, calc((100vh - var(--nav-h)) * 1.7917));
      aspect-ratio: 1376 / 768; display: block; z-index: 5;
    }
    /* The playfield is a black slab; keep it out of the way until a stage runs. */
    body:not(.playing) #game-mount { visibility: hidden; }
    /* Measured from the artwork: the painted black screen. */
    .bf-screen {
      position: absolute; left: 30.9%; top: 50.3%; width: 38.1%; height: 36.1%;
      display: flex; flex-direction: column; justify-content: center; gap: 2.2%;
      padding: 1.6% 2.2%; text-align: center; color: #fff;
      container-type: inline-size;
    }
    .bf-screen-line {
      margin: 0; font-family: var(--f-body); line-height: 1.45;
      font-size: clamp(8px, 3.4cqw, 15px); color: rgba(255,255,255,.9);
    }
    .bf-screen .bf-keys {
      font-size: clamp(7px, 2.7cqw, 12px); line-height: 1.6; color: rgba(255,255,255,.6);
    }
    .bf-screen .bf-keys b { padding: 2px 5px; }
    .bf-screen .bf-note {
      font-size: clamp(6.5px, 2.5cqw, 11px); max-width: none; color: rgba(255,255,255,.45);
    }
    .bf-screen .bf-modes { gap: 2.5%; margin: 0; }
    .bf-screen .bf-mode { padding: 3% 4%; border-radius: 8px; }
    .bf-screen .bf-mode-kicker { font-size: clamp(5.5px, 2cqw, 9px); letter-spacing: .16em; }
    .bf-screen .bf-mode-title { font-size: clamp(8px, 3cqw, 14px); margin: 2px 0 3px; }
    .bf-screen .bf-mode-tag { font-size: clamp(5px, 1.9cqw, 8.5px); margin-top: 3px; }

    /* Buttons live under the painted screen, on the artwork. */
    .bf-below {
      position: absolute; left: 50%; top: 88.5%; transform: translate(-50%, -50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      padding: 10px 22px; border-radius: 16px;
      background: rgba(6,6,8,.72); backdrop-filter: blur(6px);
      box-shadow: 0 10px 34px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.08);
    }
    .bf-below .bf-btn { margin-top: 0; padding: 11px 32px; font-size: 13px; }
    .bf-below .bf-btn.ghost { padding: 8px 20px; font-size: 11px; }
    .bf-below .bf-best { font-size: 10px; }
    /* On a narrow screen the painted rectangle is only a couple of hundred pixels
       across, far too small to hold the copy, so stop registering onto the artwork
       and fall back to a centred card with the art as a backdrop. */
    @media (max-width: 820px) {
      .bf-overlay.title {
        position: fixed; inset: var(--nav-h) 0 0 0;
        top: var(--nav-h); left: 0; transform: none;
        width: auto; aspect-ratio: auto; z-index: 5;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 14px; padding: 20px;
        background: rgba(6,6,8,0.74); backdrop-filter: blur(4px);
      }
      .bf-screen {
        position: static; width: 100%; max-width: 400px; height: auto;
        gap: 12px; padding: 0;
      }
      .bf-screen-line { font-size: 14px; }
      .bf-screen .bf-keys { font-size: 11.5px; }
      .bf-screen .bf-note { font-size: 11px; }
      .bf-screen .bf-mode-kicker { font-size: 8.5px; }
      .bf-screen .bf-mode-title { font-size: 13px; }
      .bf-screen .bf-mode-tag { font-size: 8px; }
      .bf-screen .bf-mode { padding: 10px 11px; }
      .bf-mode-hover {
        position: static; transform: none; opacity: 1; width: auto;
        padding: 7px 0 0; background: none; backdrop-filter: none; box-shadow: none;
        font-size: 11px; line-height: 1.45; color: rgba(255,255,255,.6);
      }
      .bf-mode-hover::after { display: none; }
      .bf-below {
        position: static; transform: none; padding: 0; gap: 10px;
        background: none; backdrop-filter: none; box-shadow: none;
      }
      .bf-below .bf-btn { padding: 13px 34px; font-size: 13px; }
    }
    .bf-modes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; margin: 6px 0 2px; }
    .bf-mode {
      text-align: left; background: rgba(255,255,255,0.04); border: 0; cursor: pointer;
      border-radius: 12px; padding: 12px 13px; color: #fff; font-family: var(--f-body);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.1);
      transition: background .18s ease, box-shadow .18s ease, transform .18s var(--ease);
    }
    .bf-mode:hover { transform: translateY(-2px); background: rgba(255,255,255,0.07); }
    .bf-mode.on {
      background: rgba(139,148,33,0.16);
      box-shadow: inset 0 0 0 1.5px var(--accent-lt), 0 6px 22px rgba(0,0,0,.4);
    }
    .bf-mode-kicker { font-family: var(--f-display); font-size: 9px; letter-spacing: .22em; color: var(--accent-lt); }
    .bf-mode.on .bf-mode-kicker::after { content: ' · SELECTED'; }
    .bf-mode-title { font-family: var(--f-display); font-size: 15px; font-weight: 900; letter-spacing: .02em; margin: 3px 0 6px; line-height: 1.05; }
    .bf-mode-body { font-size: 10.5px; line-height: 1.5; color: rgba(255,255,255,0.62); }
    .bf-mode-tag { margin-top: 7px; font-family: var(--f-display); font-size: 8.5px; letter-spacing: .13em; color: rgba(255,255,255,0.38); }
    /* The full pitch, held back until you hover the card. */
    .bf-mode { position: relative; }
    .bf-mode-hover {
      position: absolute; left: 50%; bottom: calc(100% + 10px);
      transform: translate(-50%, 6px);
      width: max(260px, 116%); padding: 12px 14px; border-radius: 11px;
      font-family: var(--f-body); font-size: 12.5px; line-height: 1.55;
      color: rgba(255,255,255,.86); text-align: left;
      background: rgba(8,8,11,.96); backdrop-filter: blur(10px);
      box-shadow: 0 16px 44px rgba(0,0,0,.75), inset 0 0 0 1px rgba(255,255,255,.12);
      opacity: 0; pointer-events: none; z-index: 8;
      transition: opacity .16s ease, transform .16s var(--ease);
    }
    .bf-mode-hover::after {
      content: ''; position: absolute; top: 100%; left: 50%; margin-left: -7px;
      border: 7px solid transparent; border-top-color: rgba(8,8,11,.96);
    }
    .bf-mode:hover .bf-mode-hover,
    .bf-mode:focus-visible .bf-mode-hover { opacity: 1; transform: translate(-50%, 0); }
    .bf-mode.on .bf-mode-hover { box-shadow: 0 16px 44px rgba(0,0,0,.75), inset 0 0 0 1px rgba(170,180,42,.5); }
    @media (max-width: 560px) {
      .bf-modes { grid-template-columns: 1fr; }
      .bf-mode-body { display: none; }
    }

    .bf-overlay.achievements .bf-card { max-width: 640px; }
    .bf-ach-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
      width: 100%; margin: 4px 0 2px;
    }
    .bf-ach {
      background: rgba(255,255,255,0.05); border-radius: 10px; padding: 10px 8px;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08); text-align: center;
    }
    .bf-ach.locked { opacity: .42; filter: grayscale(1); }
    .bf-ach.got { box-shadow: inset 0 0 0 1px rgba(170,180,42,0.55); background: rgba(139,148,33,0.12); }
    .bf-ach-badge {
      width: 62px; height: 62px; margin: 0 auto 8px; display: grid; place-items: center;
      font-size: 34px; line-height: 1;
    }
    .bf-ach-badge img { width: 62px; height: 62px; object-fit: contain; }
    .bf-ach-badge img[src=""], .bf-ach-badge img:not([src]) { display: none; }
    .bf-ach-title {
      font-family: var(--f-display); font-size: 12.5px; font-weight: 800;
      letter-spacing: .05em; line-height: 1.22; margin-bottom: 5px;
    }
    .bf-ach.got .bf-ach-title { color: var(--accent-lt); }
    .bf-ach-blurb { font-size: 11.5px; line-height: 1.45; color: rgba(255,255,255,0.62); }
    @media (max-width: 560px) {
      .bf-ach-grid { grid-template-columns: repeat(2, 1fr); gap: 7px; }
      .bf-ach-blurb { display: none; }
    }

    .bf-overlay.boss .bf-card { max-width: 560px; }
    .bf-overlay.boss .bf-body { font-size: 15.5px; }
    .bf-overlay.boss.menace { background: rgba(2,2,3,0.94); }
    .bf-overlay.boss.menace .bf-title { color: #e23c2f; }
    .bf-beats { display: flex; gap: 7px; justify-content: center; margin-top: 6px; }
    .bf-beat { width: 22px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.16); }
    .bf-beat.on { background: var(--accent-lt); }

    .bf-overlay.share .bf-card { max-width: 470px; }
    .bf-share-preview {
      width: 100%; max-width: 300px; aspect-ratio: 1; border-radius: 12px;
      overflow: hidden; background: rgba(255,255,255,0.05);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.12), 0 10px 34px rgba(0,0,0,.5);
      display: grid; place-items: center;
    }
    .bf-share-preview img { width: 100%; height: 100%; object-fit: contain; display: block; }
    .bf-share-building {
      font-family: var(--f-display); font-size: 12px; letter-spacing: .18em;
      color: rgba(255,255,255,0.45);
    }
    .bf-share-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    .bf-share-row .bf-btn { margin-top: 0; }
    .bf-share-links { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; margin-top: 2px; }
    .bf-share-link {
      font-family: var(--f-display); font-size: 12px; font-weight: 700; letter-spacing: .12em;
      text-transform: uppercase; color: rgba(255,255,255,0.75);
      padding: 9px 15px; border-radius: 999px; cursor: pointer;
      background: rgba(255,255,255,0.07); border: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.13);
      transition: background .16s ease, color .16s ease;
    }
    .bf-share-link:hover { background: rgba(255,255,255,0.15); color: #fff; }

    .bf-cutscene {
      position: absolute; inset: 0; z-index: 20; background: #000;
      opacity: 1; transition: opacity .3s ease;
    }
    .bf-cutscene.out { opacity: 0; }

    @media (max-width: 640px) {
      .bf-hud { padding: 10px 12px; }
      .bf-stage-name { font-size: 13px; }
      .bf-stage-sub { display: none; }
      .bf-score { font-size: 16px; }
      .bf-toast { font-size: 16px; }
    }
  </style>
</head>
<body class="game-page">

  <div class="cursor" id="cursor"></div>
  <div class="cursor-dot" id="cursorDot"></div>

  <nav class="nav scrolled" id="nav">
    <a href="index.html" class="nav-logo" aria-label="Blowing Frog home">
      <img src="assets/images/logo_blowingfrog.png" alt="Blowing Frog" class="logo-img"
           onerror="this.outerHTML='<div class=logo-fallback>BF</div>'">
      <span class="logo-wordmark">Blowing Frog</span>
    </a>
    <div class="nav-links">
      <a href="about.html"    class="nav-link">About Us</a>
      <a href="services.html" class="nav-link">Services</a>
      <a href="contact.html"  class="nav-link">Contact</a>
      <a href="play.html"     class="nav-link active">Play</a>
    </div>
    <div class="nav-actions">
      <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      </button>
      <button class="nav-hamburger" id="navHamburger" aria-label="Menu"><span></span><span></span><span></span></button>
    </div>
  </nav>

  <main id="game-root">
    <div id="game-portal" aria-hidden="true"></div>
    <div id="game-stack">
      <div id="game-mount">
        <div id="game-loading">Loading the swamp…</div>
      </div>
      <div id="overlay-root"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.20.1/dist/pixi.min.js"></script>
  <script type="module" src="game/main.js?v=39"></script>
</body>
</html>
