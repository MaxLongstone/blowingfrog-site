# Protect /admin — only users with role=admin can reach it
[[redirects]]
  from = "/admin/*"
  to = "/admin/:splat"
  status = 200
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/admin"
  to = "/"
  status = 302
  conditions = { Role = ["!admin"] }

[[redirects]]
  from = "/admin/*"
  to = "/"
  status = 302
  conditions = { Role = ["!admin"] }

# Headers for /admin — strict CSP
[[headers]]
  for = "/admin/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://identity.netlify.com https://unpkg.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' https://api.netlify.com https://identity.netlify.com https://api.github.com;"
